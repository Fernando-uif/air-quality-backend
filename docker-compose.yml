services:

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,z
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  db:
    image: amazon/dynamodb-local:2.5.3
    container_name: dynamodb-local
    restart: unless-stopped
    ports:
      - "8012:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/shell/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  cli:
    image: amazon/aws-cli:2.33.20
    depends_on:
      db:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c", "aws dynamodb create-table --table-name iot_devices --attribute-definitions AttributeName=device_id,AttributeType=S --key-schema AttributeName=device_id,KeyType=HASH --billing-mode PAY_PER_REQUEST --endpoint-url http://db:8000 --no-cli-pager 2>/dev/null; aws dynamodb create-table --table-name iot_measurements --attribute-definitions AttributeName=device_id,AttributeType=S AttributeName=timestamp,AttributeType=N AttributeName=country_state,AttributeType=S --key-schema AttributeName=device_id,KeyType=HASH AttributeName=timestamp,KeyType=RANGE --global-secondary-indexes '[{\"IndexName\":\"region-timestamp-index\",\"KeySchema\":[{\"AttributeName\":\"country_state\",\"KeyType\":\"HASH\"},{\"AttributeName\":\"timestamp\",\"KeyType\":\"RANGE\"}],\"Projection\":{\"ProjectionType\":\"ALL\"}}]' --billing-mode PAY_PER_REQUEST --endpoint-url http://db:8000 --no-cli-pager 2>/dev/null; echo 'Tablas listas'"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-backend
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      MQTT_BROKER_URL: tcp://mqtt:1883
      DYNAMODB_ENDPOINT: http://db:8000
      AWS_REGION: us-east-1
    depends_on:
      mqtt:
        condition: service_healthy
      db:
        condition: service_healthy

volumes:
  mosquitto_data:
  mosquitto_log:
