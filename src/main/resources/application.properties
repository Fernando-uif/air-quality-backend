spring.application.name=iot-sensor-network-mqtt
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:8080}
server.servlet.context-path=/iot-sensor-network

# Actuator - Health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Swagger
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/openapi.json
springdoc.default-produces-media-type=application/json

# DynamoDB tables
aws.dynamodb.devices-table=${DEVICES_TABLE:iot_devices}
aws.dynamodb.measurements-table=${MEASUREMENTS_TABLE:iot_measurements}
aws.dynamodb.region=${AWS_REGION:us-east-1}
aws.dynamodb.endpoint=${DYNAMODB_ENDPOINT:http://localhost:8012}

# Security - HMAC
security.timestamp-tolerance=${TIMESTAMP_TOLERANCE:600}
security.registration-key=${REGISTRATION_KEY:mi_clave_secreta_2026}

# CORS
cors.allowed-origins=${ALLOWED_ORIGINS:*}

# MQTT
mqtt.broker.url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client.id=${MQTT_CLIENT_ID:iot-backend-server}
